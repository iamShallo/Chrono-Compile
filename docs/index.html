<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Chrono Compile</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar"><div id="unity-progress-bar-full"></div></div>
      </div>
      <section id="creator-splash" aria-label="Crediti">
        <div class="creator-card">
          <p class="creator-label">Made by</p>
          <a class="creator-profile" href="https://github.com/iamShallo" target="_blank" rel="noreferrer">
            <img class="creator-avatar" src="https://avatars.githubusercontent.com/u/148480520?v=4&amp;s=256" alt="Avatar GitHub di Francesco Caldarelli">
            <span class="creator-name">Francesco Caldarelli</span>
            <span class="creator-handle">@iamShallo</span>
          </a>
        </div>
      </section>
      <div id="unity-warning"></div>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const container = document.querySelector("#unity-container");

      function unityShowBanner(message, type) {
        const warning = document.querySelector("#unity-warning");
        warning.textContent = message;
        warning.className = type || "";
        warning.style.display = "block";
        if (type !== "error") {
          setTimeout(() => {
            warning.style.display = "none";
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/ChronoCompile.data",
        frameworkUrl: buildUrl + "/ChronoCompile.framework.js",
        codeUrl: buildUrl + "/ChronoCompile.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Shallo",
        productName: "Chrono Compile",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";
      const loader = document.createElement("script");
      loader.src = buildUrl + "/ChronoCompile.loader.js";
      loader.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = `${progress * 100}%`;
        }).then(() => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          const creatorSplash = document.querySelector("#creator-splash");
          requestAnimationFrame(() => creatorSplash.classList.add("is-visible"));
          window.setTimeout(() => {
            creatorSplash.classList.remove("is-visible");
            window.setTimeout(() => creatorSplash.remove(), 500);
          }, 2200);
        }).catch((message) => {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
